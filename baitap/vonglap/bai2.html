<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Hình vuông </title>
    <link rel="stylesheet" href="bai2.css">
</head>

<body>
    <script>
        for (var i = 0; i < 6; i++) {
            for (var j = 0; j < 11; j++) {
                if (i % 2 == 0) {
                    document.write("<div class='square'></div>");
                } else {
                    document.write("<div class='square2'></div>");
                }
            }
            document.write("<div style='clear:both'></div>");
        }
    </script>
</body>

</html>
