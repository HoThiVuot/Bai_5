<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>sinh viên</title>
</head>

<body>
    <script>
        var SinhVien = {
            name: "Hồ Thị Vượt",
            year: 2007,
            gender: "Nữ",
            hometown: "Quảng Trị"
        };

        for (var x in SinhVien) {
            document.write(SinhVien[x]);
            document.write("<hr>");
        }
    </script>
</body>

</html>
