<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let tong = 0;
        let i = 0;
        while (i < 6) {
            tong = tong + i;
            i++;
        }
        document.write("Tổng các số từ 0 đến 5 là:", tong + "<br>");
        // console.log(tong);
    </script>
</body>

</html>
